name: Create and publish a Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DOMAIN: pdsls.northsky.social
  APP_PROTOCOL: https

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # The GITHUB_TOKEN is passed as a BuildKit secret so `bun install` can
      # read @northskysocial/stratos-client from GitHub Packages.
      - name: Write registry token secret
        run: printf '%s' "${GITHUB_TOKEN}" > /tmp/node_auth_token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            node_auth_token=/tmp/node_auth_token
          build-args: |
            APP_DOMAIN=${{ env.APP_DOMAIN }}
            APP_PROTOCOL=${{ env.APP_PROTOCOL }}

      - name: Generate artifact attestation
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy_to_kubernetes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-and-push-image
    permissions:
      contents: read
    steps:
      - name: Trigger release through webhook
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DEPLOYMENT_WEBHOOK_TOKEN }}
          repository: ${{ secrets.DEPLOYMENT_WEBHOOK_REPOSITORY }}
          event-type: restart-pdsls

  notify_deployment:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: deploy_to_kubernetes
    permissions:
      contents: read
    steps:
      - name: Wait for successful deployment (1 minute)
        run: sleep 60s

      - name: Notify Discord of successful deployment
        uses: rjstone/discord-webhook-notify@13eb215cbf853107dd9386c4a2f4035b7988cfc2 # v2.3.0
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          severity: info
          username: 'Github Actions deployment'
          title: 'PDSlss deployment successful!'
          description: 'Latest build has been deployed to production successfully!'
          details: 'Commit: ${{ github.event.head_commit.message }}'
