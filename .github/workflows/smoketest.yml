name: Smoketest

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build-and-serve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build project
        run: bun run build

      - name: Check formatting
        run: bun run format:check

      # Serve the built bundle and request it once. The other steps prove the
      # app compiles. This step proves it also starts.
      - name: Start preview server and verify
        run: |
          bun run serve &
          SERVER_PID=$!
          curl --fail --silent --show-error --output /dev/null \
            --retry 10 --retry-delay 1 --retry-connrefused --max-time 30 \
            http://localhost:4173 || { kill $SERVER_PID 2>/dev/null; exit 1; }
          kill $SERVER_PID 2>/dev/null || true
